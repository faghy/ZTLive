# Progetto Xcode generato con XcodeGen (`xcodegen generate`), anche in CI.
name: ZTLive
options:
  bundleIdPrefix: com.faghy
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    TARGETED_DEVICE_FAMILY: "1"

packages:
  ZTLCore:
    path: Packages/ZTLCore

targets:
  ZTLive:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - RouteCheck
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: ZTLCore
      - target: ZTLiveWidget
      - target: ZTLiveShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faghy.ztlive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: ZTLive
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: ZTLive usa la posizione per avvisarti quando ti avvicini a un varco ZTL, anche mentre usi Google Maps.
        NSLocationAlwaysAndWhenInUseUsageDescription: ZTLive usa la posizione per avvisarti quando ti avvicini a un varco ZTL, anche mentre usi Google Maps.
        LSApplicationQueriesSchemes:
          - comgooglemaps
          - comgooglemapsurl
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
    scheme: {}

  ZTLiveWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faghy.ztlive.widget
    info:
      path: Generated/Widget-Info.plist
      properties:
        CFBundleDisplayName: ZTLive
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ZTLiveShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - RouteCheck
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: ZTLCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faghy.ztlive.share
    info:
      path: Generated/Share-Info.plist
      properties:
        CFBundleDisplayName: ZTLive
        NSLocationWhenInUseUsageDescription: ZTLive usa la posizione per controllare i percorsi che partono da dove ti trovi.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
